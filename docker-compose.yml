# Стек мониторинга: echo-API за обратным прокси nginx.
#
#   клиент --> proxy (nginx, порт 80) --> api (http-echo, порт 8080)
#
# Наружу публикуется только порт 80. Сервис api доступен лишь из внутренней
# сети monitoring, прокси обращается к нему по имени сервиса.

services:
  api:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"
    networks:
      - monitoring
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
